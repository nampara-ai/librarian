name: Librarian terminal builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'tools/package.py'
      - 'tools/office_bundle.py'
      - 'tools/check_layout.py'
      - 'docs/RUST_FOUNDATION.md'
      - 'docs/THIRD_PARTY.md'
      - '.github/workflows/rust-foundation.yml'
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'tools/package.py'
      - 'tools/office_bundle.py'
      - 'tools/check_layout.py'
      - '.github/workflows/rust-foundation.yml'

permissions:
  contents: read

concurrency:
  group: rust-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  models:
    name: Verified shared OCR models
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned common model archives
        run: python tools/package.py --fetch-common
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-ocr-models
          path: .build-assets/*_onnx_infer.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  native:
    name: Native (${{ matrix.target }})
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-ocr-models
          path: .build-assets
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install office renderer build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-impress
      - name: Verify private Linux office dependency closure
        if: runner.os == 'Linux'
        run: python tools/office_bundle.py x86_64-unknown-linux-gnu --check
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build release executable
        run: cargo build --release --locked -p librarian-cli --target ${{ matrix.target }}
      - name: Critical persistence and budget invariants
        run: cargo test --locked -p librarian-core -p librarian-native --lib --test persistence --target ${{ matrix.target }}
      - name: Package executable, engines, models and licenses
        run: python tools/package.py ${{ matrix.target }} --check-engines
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librarian-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: WASM build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install WASM build tool
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build the two WASM bindings
        run: |
          wasm-pack build crates/librarian-wasm --target nodejs --out-dir pkg --release -- --locked
          wasm-pack build crates/librarian-wasm --target web --out-dir pkg-web --release -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librarian-wasm
          path: |
            crates/librarian-wasm/pkg
            crates/librarian-wasm/pkg-web
          if-no-files-found: error
