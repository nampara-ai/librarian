name: Librarian terminal builds

# This workflow validates the Rust terminal program and the scripts under
# tools/. The legacy Python application is validated by ci.yml.
#
# There is no path filter on pull requests. A workflow that a path filter
# skips reports nothing, and a required check that reports nothing never
# completes. The job "changes" decides which jobs run instead. A job skipped
# by its "if" condition reports "skipped", which a required check accepts.
# "Rust required" is the check to require on main. Do not require the
# "Native (...)" checks one by one: GitHub evaluates a job's "if" before it
# expands the matrix, so a skipped "native" job reports no per-target check.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'tools/package.py'
      - 'tools/office_bundle.py'
      - 'tools/check_layout.py'
      - 'docs/RUST_FOUNDATION.md'
      - 'docs/PARSING_FOUNDATION.md'
      - 'docs/THIRD_PARTY.md'
      - 'docs/licenses/**'
      - 'LICENSE'
      - '.github/workflows/rust-foundation.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Rust changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      tools: ${{ steps.areas.outputs.tools }}
      targets: ${{ steps.areas.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the areas this change touches
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A push that passed the path filter above and a manual run check
          # everything. A pull request is compared with its merge base. When
          # the comparison cannot be made, everything is checked.
          everything=false
          merge_base=""
          sha='^[0-9a-f]{40,64}$'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME}: every area is treated as changed."
            everything=true
          elif ! [[ "${BASE_SHA:-}" =~ $sha && "${HEAD_SHA:-}" =~ $sha ]]; then
            echo "The event names no base or head commit: every area is treated as changed."
            everything=true
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "The base or head commit was not fetched: every area is treated as changed."
            everything=true
          elif ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || [ -z "$merge_base" ]; then
            echo "The base and head commits share no history: every area is treated as changed."
            everything=true
          fi

          rust=false
          tools=false
          if [ "$everything" = true ]; then
            rust=true
            tools=true
          else
            changed="${RUNNER_TEMP}/changed-paths"
            git diff --name-only --no-renames -z "$merge_base" "$HEAD_SHA" > "$changed"
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              # The program, its packaging tools and the documents it ships.
              case "$path" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/*) rust=true ;;
                tools/package.py|tools/office_bundle.py|tools/check_layout.py) rust=true ;;
                docs/RUST_FOUNDATION.md|docs/PARSING_FOUNDATION.md|docs/THIRD_PARTY.md) rust=true ;;
                docs/licenses/*|LICENSE|.github/workflows/rust-foundation.yml) rust=true ;;
              esac
              # The Python scripts and the lint settings they inherit.
              case "$path" in
                tools/*|pyproject.toml|.github/workflows/rust-foundation.yml) tools=true ;;
              esac
            done < "$changed"
            echo "Compared ${merge_base} with ${HEAD_SHA}: ${count} changed paths."
          fi

          echo "rust=${rust}" | tee -a "$GITHUB_OUTPUT"
          echo "tools=${tools}" | tee -a "$GITHUB_OUTPUT"

          # macOS and Windows minutes are billed at a multiple of Linux minutes.
          # A push to a working branch builds and tests on Linux only. A pull
          # request, a push to main and a manual run use all four targets.
          linux='{"runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","suffix":""}'
          others='{"runner":"macos-15","target":"aarch64-apple-darwin","suffix":""},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","suffix":""},{"runner":"windows-2022","target":"x86_64-pc-windows-msvc","suffix":".exe"}'
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "targets=[${linux}]" | tee -a "$GITHUB_OUTPUT"
          else
            echo "targets=[${others},${linux}]" | tee -a "$GITHUB_OUTPUT"
          fi

  tools-lint:
    name: Tools lint
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Ruff
        # The same requirement as the "dev" extra in pyproject.toml, which the
        # release workflow installs before it runs "ruff check .".
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/python" -m pip install "ruff>=0.6.9"
      - name: Lint the packaging and measurement scripts
        # Settings: tools/ruff.toml, which extends pyproject.toml.
        run: |
          "$RUNNER_TEMP/ruff/bin/ruff" check tools

  models:
    name: Verified office renderer and OCR models
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install office renderer build dependencies
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-impress
      - name: Verify private Linux office dependency closure
        run: python tools/office_bundle.py x86_64-unknown-linux-gnu --check
      - name: Archive verified private Linux renderer
        run: tar -czf .build-assets/verified-linux-office.tar.gz -C .build-assets office-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux-office
          path: .build-assets/verified-linux-office.tar.gz
          include-hidden-files: true
          retention-days: 7
      - name: Fetch pinned common model archives
        run: python tools/package.py --fetch-common
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-ocr-models
          path: .build-assets/*_onnx_infer.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  native:
    name: Native (${{ matrix.target }})
    needs: [changes, models]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The targets are chosen by the job "changes": all four, or Linux only
        # for a push to a working branch.
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-ocr-models
          path: .build-assets
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Linux'
        with:
          name: verified-linux-office
          path: .build-assets
      - name: Extract verified private Linux renderer
        if: runner.os == 'Linux'
        run: tar -xzf .build-assets/verified-linux-office.tar.gz -C .build-assets
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build release executable
        run: cargo build --release --locked -p librarian-cli --target ${{ matrix.target }}
      - name: Critical persistence and budget invariants
        run: cargo test --locked -p librarian-core -p librarian-native --lib --test persistence --target ${{ matrix.target }}
      - name: Package executable, engines, models and licenses
        run: python tools/package.py ${{ matrix.target }} --check-engines
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librarian-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: WASM build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install WASM build tool
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build the two WASM bindings
        run: |
          wasm-pack build crates/librarian-wasm --target nodejs --out-dir pkg --release -- --locked
          wasm-pack build crates/librarian-wasm --target web --out-dir pkg-web --release -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: librarian-wasm
          path: |
            crates/librarian-wasm/pkg
            crates/librarian-wasm/pkg-web
          if-no-files-found: error

  # Always runs and always reports. It fails when a job that had to run did
  # not succeed, and passes when the jobs succeeded or did not apply.
  rust-required:
    name: Rust required
    needs: [changes, tools-lint, models, native, wasm]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Report the result of the Rust checks
        shell: bash
        env:
          RUST: ${{ needs.changes.outputs.rust }}
          TOOLS: ${{ needs.changes.outputs.tools }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TOOLS_LINT_RESULT: ${{ needs.tools-lint.result }}
          MODELS_RESULT: ${{ needs.models.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WASM_RESULT: ${{ needs.wasm.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::The job that finds the changed areas ended as ${CHANGES_RESULT}."
            exit 1
          fi
          for area in "$RUST" "$TOOLS"; do
            if [ "$area" != "true" ] && [ "$area" != "false" ]; then
              echo "::error::The changed areas were not reported."
              exit 1
            fi
          done

          failed=0
          # check NAME RESULT APPLIES: a job that applies must have succeeded,
          # and a job that does not apply must have been skipped.
          check() {
            local expected=skipped
            if [ "$3" = "true" ]; then
              expected=success
            fi
            if [ "$2" = "$expected" ]; then
              echo "$1: $2"
            else
              echo "::error::$1 ended as $2; expected ${expected}."
              failed=1
            fi
          }
          check "Tools lint" "$TOOLS_LINT_RESULT" "$TOOLS"
          check "Verified office renderer and OCR models" "$MODELS_RESULT" "$RUST"
          check "Native, all targets" "$NATIVE_RESULT" "$RUST"
          check "WASM build" "$WASM_RESULT" "$RUST"
          exit "$failed"
