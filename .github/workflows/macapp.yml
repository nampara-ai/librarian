name: Mac App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # Build the app on every PR that touches it, so Swift never meets the
  # compiler for the first time on an immutable release tag.
  pull_request:
    paths:
      - "apps/macos/**"
      - ".github/workflows/macapp.yml"
      # Backend changes must exercise the bundled-runtime OCR e2e test on PRs,
      # not meet the bundler for the first time on an immutable release tag.
      - "src/librarian/**"
      - "pyproject.toml"

permissions:
  # This workflow only builds and uploads artifacts (actions/upload-artifact);
  # it never writes to repo contents. Least privilege: read only.
  contents: read

jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. We used to also cross-build an Intel (x86_64)
          # DMG under Rosetta, but cryptography (pulled in by markitdown[pdf]
          # via pdfminer-six) dropped Intel macOS wheels at 49.0.0 — the same
          # release that fixed the CVEs the bundle must ship. A self-contained
          # Intel app therefore can't be built from prebuilt wheels without
          # shipping a vulnerable cryptography, so we no longer publish it.
          # Intel Mac users install via pip or Docker, which stay patched.
          - arch: arm64
            artifact: Librarian-AppleSilicon
            brew_prefix: /opt/homebrew
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build backend wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel

      - name: Export dependency constraints
        # Exact third-party pins from uv.lock, same as the Release workflow.
        # Passed to bundle_backend.sh so the bundled runtime's dependencies are
        # pinned/reproducible rather than resolved to latest at build time.
        run: python .github/scripts/export_constraints.py --output constraints.txt

      - name: Build app bundle
        working-directory: apps/macos
        run: make app ARCH_FLAGS="--arch ${{ matrix.arch }}"

      - name: Bundle backend
        working-directory: apps/macos
        run: |
          scripts/bundle_backend.sh \
            --app dist/Librarian.app \
            --wheel "$(ls ../../dist/nampara_librarian-*.whl)" \
            --arch ${{ matrix.arch }} \
            --constraints ../../constraints.txt

      - name: Install OCR tools (arm64 native Homebrew)
        run: brew install tesseract poppler dylibbundler

      - name: Bundle OCR tools
        working-directory: apps/macos
        run: |
          scripts/bundle_ocr.sh \
            --app dist/Librarian.app \
            --arch ${{ matrix.arch }} \
            --brew-prefix ${{ matrix.brew_prefix }}

      - name: Verify bundled OCR works end to end
        working-directory: apps/macos
        env:
          # Keep the bundled interpreter from writing __pycache__ into the
          # bundle during checks; the bundle is sealed by signing below and
          # must carry only what the build installed.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Exercise the exact production path — pdf2image (poppler) +
          # pytesseract (tesseract) + bundled tessdata + relocated dylibs —
          # from inside the app bundle, so a relocation or arch mistake fails
          # the PR build instead of an immutable release tag.
          APP="$PWD/dist/Librarian.app"
          PY="$APP/Contents/Resources/backend/python/bin/python3"
          export PATH="$APP/Contents/Resources/ocr/bin:$PATH"
          export TESSDATA_PREFIX="$APP/Contents/Resources/ocr/share/tessdata"
          tesseract --version
          pdfinfo -v
          "$PY" <<'CHECK'
          # Build a minimal valid PDF (standard Helvetica, correct xref) without
          # Pillow's PDF writer, which needs a JPEG encoder the bundled runtime
          # lacks. Then run the exact production chain: pdf2image (pdftoppm) ->
          # tesseract, proving the relocated binaries and bundled tessdata work.
          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 220] "
              b"/Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          stream = b"BT /F1 60 Tf 40 90 Td (LIBRARIAN OCR) Tj ET"
          objects.append(b"<< /Length %d >>\nstream\n%s\nendstream" % (len(stream), stream))

          pdf = b"%PDF-1.4\n"
          offsets = []
          for index, obj in enumerate(objects, start=1):
              offsets.append(len(pdf))
              pdf += b"%d 0 obj\n%s\nendobj\n" % (index, obj)
          xref_pos = len(pdf)
          pdf += b"xref\n0 %d\n0000000000 65535 f \n" % (len(objects) + 1)
          for off in offsets:
              pdf += b"%010d 00000 n \n" % off
          pdf += b"trailer\n<< /Size %d /Root 1 0 R >>\nstartxref\n%d\n%%%%EOF\n" % (
              len(objects) + 1,
              xref_pos,
          )
          with open("ocrcheck.pdf", "wb") as handle:
              handle.write(pdf)

          import pdf2image
          import pytesseract

          pages = pdf2image.convert_from_path("ocrcheck.pdf", dpi=200)
          text = pytesseract.image_to_string(pages[0]).upper()
          assert "LIBRARIAN" in text, f"OCR did not read the test PDF: {text!r}"
          print("bundled OCR OK:", text.strip())
          CHECK

      - name: Verify bundled runtime can reach AI providers
        working-directory: apps/macos
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # A 401 proves DNS, TCP, and TLS all work from the bundled runtime;
          # certificate failures or timeouts fail the build.
          PY="dist/Librarian.app/Contents/Resources/backend/python/bin/python3"
          "$PY" <<'CHECK'
          import urllib.error
          import urllib.request

          try:
              urllib.request.urlopen("https://api.anthropic.com/v1/models", timeout=15)
          except urllib.error.HTTPError as error:
              assert error.code in (401, 403), f"unexpected status {error.code}"
              print("bundled runtime TLS + connectivity OK: HTTP", error.code)
          CHECK

      - name: Check for signing identity
        id: signing
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERT" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm certificate.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Prune bytecode caches before sealing
        working-directory: apps/macos
        run: |
          # bundle_backend.sh prunes the caches from its own smoke run, and the
          # checks above run with PYTHONDONTWRITEBYTECODE, so this should find
          # nothing — it is a safety net so the sealed bundle deterministically
          # carries only what the build installed, whatever ran before signing.
          find dist/Librarian.app/Contents/Resources/backend -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: Sign app (Developer ID)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/macos
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: scripts/sign_app.sh --app dist/Librarian.app --identity "$IDENTITY"

      - name: Sign app (ad-hoc)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: apps/macos
        run: scripts/sign_app.sh --app dist/Librarian.app

      - name: Verify the SIGNED app starts
        working-directory: apps/macos
        env:
          # The bundle is sealed at this point. Python must NOT write
          # __pycache__ into it: any new file under Contents/Resources after
          # sealing invalidates the code-signature resource seal, and Apple's
          # notary then rejects the whole bundle as "Invalid". That is exactly
          # what broke the first notarized build — this very step wrote 406
          # .pyc files into the freshly sealed bundle.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # Run the signed interpreter through the app's real startup import
          # chain (librarian -> pydantic -> pydantic_core native extension).
          # Signing is what applies the hardened runtime and entitlements, so a
          # code-signing mistake that blocks loading third-party native
          # extensions (e.g. hardened runtime WITHOUT
          # com.apple.security.cs.disable-library-validation) only surfaces
          # here. The pre-sign OCR/connectivity checks run against the unsigned
          # bundle and cannot catch it. Runs for both ad-hoc and Developer ID
          # builds so neither can ship an engine that won't boot.
          PY="dist/Librarian.app/Contents/Resources/backend/python/bin/python3"
          "$PY" -m librarian version

      - name: Verify the sealed bundle was not modified by the smoke test
        working-directory: apps/macos
        run: |
          # Guard against ANY post-signing mutation of the bundle (bytecode
          # caches, temp files, ...). A strict deep verify fails right here
          # with a clear "resources modified" message instead of surfacing
          # minutes later as an opaque notarization "Invalid".
          codesign --verify --deep --strict --verbose=2 dist/Librarian.app

      - name: Create DMG
        working-directory: apps/macos
        run: scripts/make_dmg.sh --app dist/Librarian.app --output "dist/${{ matrix.artifact }}.dmg"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        working-directory: apps/macos
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_APP_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/${{ matrix.artifact }}.dmg"
          # Submit and wait, capturing the machine-readable result. Apple
          # reports a rejection as a bare status of "Invalid" — the per-file
          # reasons live in a separate log keyed by submission id — so on any
          # non-Accepted status fetch and print that log. Without this a
          # notarization failure in CI is undiagnosable except by re-running
          # notarytool by hand with the credentials.
          # --timeout bounds the wait: Apple's notary occasionally leaves a
          # submission "In Progress" far longer than its usual few minutes,
          # and without a bound the step silently burns the whole 60-minute
          # job budget. On timeout notarytool exits non-zero with the
          # submission id still recorded, so the log below shows Apple's
          # status and the job fails fast enough to simply re-run.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait --timeout 30m --output-format json > notarize-result.json || true
          echo "notarytool result:"
          cat notarize-result.json || true
          echo
          SUBMISSION_ID="$(jq -r '.id // "-"' notarize-result.json 2>/dev/null || echo "-")"
          STATUS="$(jq -r '.status // "-"' notarize-result.json 2>/dev/null || echo "-")"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization status '$STATUS' (submission $SUBMISSION_ID)"
            if [ "$SUBMISSION_ID" != "-" ]; then
              echo "Apple notarization log (per-file issues):"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" \
                --password "$APP_PASSWORD" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$DMG"

      # Releases are immutable once published, so DMGs cannot be attached
      # after the fact. Tag builds publish the DMG as a workflow artifact;
      # the Release workflow collects both artifacts and includes them in
      # its single atomic `gh release create`.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/macos/dist/${{ matrix.artifact }}.dmg
          if-no-files-found: error
