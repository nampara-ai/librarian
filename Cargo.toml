[workspace]
members = ["crates/librarian-core", "crates/librarian-app", "crates/librarian-native", "crates/librarian-cli", "crates/librarian-wasm"]
default-members = ["crates/librarian-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[workspace.dependencies]
librarian-core = { path = "crates/librarian-core" }
librarian-app = { path = "crates/librarian-app" }
librarian-native = { path = "crates/librarian-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false }
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
