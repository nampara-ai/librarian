name: CI

# This workflow validates the legacy Python application, version 1.10.3, kept
# under src/, tests/ and apps/. The Rust terminal program and the scripts under
# tools/ are validated by rust-foundation.yml.
#
# There is no path filter on pull requests. A workflow that a path filter
# skips reports nothing, and a required check that reports nothing never
# completes. The job "changes" decides which jobs run instead. A job skipped
# by its "if" condition reports "skipped", which a required check accepts.
# "Legacy required" is the check to require on main.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Legacy changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legacy: ${{ steps.areas.outputs.legacy }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find whether the legacy application is affected
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # A push to main and a manual run check everything. A pull request
          # is compared with its merge base. When the comparison cannot be
          # made, everything is checked.
          everything=false
          merge_base=""
          sha='^[0-9a-f]{40,64}$'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event ${EVENT_NAME}: every area is treated as changed."
            everything=true
          elif ! [[ "${BASE_SHA:-}" =~ $sha && "${HEAD_SHA:-}" =~ $sha ]]; then
            echo "The event names no base or head commit: every area is treated as changed."
            everything=true
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "The base or head commit was not fetched: every area is treated as changed."
            everything=true
          elif ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")" || [ -z "$merge_base" ]; then
            echo "The base and head commits share no history: every area is treated as changed."
            everything=true
          fi

          legacy=false
          if [ "$everything" = true ]; then
            legacy=true
          else
            changed="${RUNNER_TEMP}/changed-paths"
            git diff --name-only --no-renames -z "$merge_base" "$HEAD_SHA" > "$changed"
            count=0
            while IFS= read -r -d '' path; do
              count=$((count + 1))
              case "$path" in
                # Linted by rust-foundation.yml.
                tools/*) ;;
                # The application, its tests and its packaging.
                src/*|tests/*|apps/*|examples/*) legacy=true ;;
                pyproject.toml|uv.lock|README.md|LICENSE) legacy=true ;;
                Dockerfile|docker-compose.yml|.dockerignore|.env.example) legacy=true ;;
                # Files the test suite reads.
                .github/scripts/*|.github/workflows/*|.github/dependabot.yml) legacy=true ;;
                CHANGELOG.md|docs/LEGACY_README.md|docs/OPERATIONS.md|.gitignore) legacy=true ;;
                # Paths the test suite forbids in the repository.
                .env|.librarian/*|docs/results/*|*eval-provider*|*benchmark-provider*) legacy=true ;;
                # Any other Python file is linted by the job "test".
                *.py) legacy=true ;;
              esac
            done < "$changed"
            echo "Compared ${merge_base} with ${HEAD_SHA}: ${count} changed paths."
          fi

          echo "legacy=${legacy}" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,all]"
      - name: Doctor
        run: .venv/bin/librarian doctor --strict
      - name: Ruff
        # Every Python file outside the top-level tools/ folder. The scripts in
        # that folder belong to the Rust program and are linted by
        # rust-foundation.yml. The release workflow lints both sets together.
        run: .venv/bin/ruff check . --extend-exclude ./tools
      - name: Dependency audit
        run: .venv/bin/pip-audit --progress-spinner off --skip-editable
      - name: Pytest
        run: .venv/bin/pytest
      - name: Pyright
        run: .venv/bin/pyright
      - name: Build distributions
        run: |
          rm -rf dist
          .venv/bin/python -m build
      - name: Smoke install wheel
        run: |
          python -m venv "$RUNNER_TEMP/librarian-wheel-smoke"
          "$RUNNER_TEMP/librarian-wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/librarian-wheel-smoke/bin/librarian" version
      - name: Docker build
        run: docker build -t librarian-ci .

  # The product ships on macOS with Darwin liteparse wheels, so the suite must
  # also pass natively on macOS — not just Linux. Reduced job: install + pytest
  # (with the OCR system tools from Homebrew). Kept required; flip to
  # `continue-on-error: true` if it proves flaky on GitHub's macOS runners.
  test-macos:
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system OCR tools
        # tesseract provides the OCR engine; poppler provides pdftoppm/pdfinfo.
        run: brew install tesseract poppler
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,all]"
      - name: Pytest
        run: .venv/bin/pytest

  # Always runs and always reports. It fails when a job that had to run did
  # not succeed, and passes when the jobs succeeded or did not apply.
  legacy-required:
    name: Legacy required
    needs: [changes, test, test-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the result of the legacy checks
        shell: bash
        env:
          LEGACY: ${{ needs.changes.outputs.legacy }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_MACOS_RESULT: ${{ needs.test-macos.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::The job that finds the changed areas ended as ${CHANGES_RESULT}."
            exit 1
          fi
          if [ "$LEGACY" != "true" ] && [ "$LEGACY" != "false" ]; then
            echo "::error::The changed areas were not reported."
            exit 1
          fi

          failed=0
          # check NAME RESULT APPLIES: a job that applies must have succeeded,
          # and a job that does not apply must have been skipped.
          check() {
            local expected=skipped
            if [ "$3" = "true" ]; then
              expected=success
            fi
            if [ "$2" = "$expected" ]; then
              echo "$1: $2"
            else
              echo "::error::$1 ended as $2; expected ${expected}."
              failed=1
            fi
          }
          check "test" "$TEST_RESULT" "$LEGACY"
          check "test-macos" "$TEST_MACOS_RESULT" "$LEGACY"
          exit "$failed"
